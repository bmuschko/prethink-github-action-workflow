name: Update Prethink context

# Regenerates Moderne Prethink context files (.moderne/context/) and opens a PR.
on:
  # Every Sunday at 06:00 UTC.
  schedule:
    - cron: "0 6 * * 0"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write        # push the branch
  pull-requests: write   # open the PR

jobs:
  prethink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history so the LST build and git operations have context.
          fetch-depth: 0

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the Moderne CLI
        run: |
          set -euo pipefail
          # Install the latest CLI via the official install script.
          curl -fsSL https://app.moderne.io/cli | bash
          # The script drops `mod` under ~/.moderne/cli/bin — put it on PATH.
          echo "$HOME/.moderne/cli/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moderne/cli/bin:$PATH"
          mod --version

      - name: Install the Prethink recipe
        # Pin a version instead of LATEST if reproducible runs are desired.
        run: mod config recipes jar install "io.moderne.recipe:rewrite-prethink:LATEST"

      - name: Build (or download) the LST
        run: mod build .

      - name: Run the Prethink recipe
        run: mod run . --recipe "io.moderne.prethink.UpdatePrethinkContextStarter"

      - name: Apply generated context files to the working tree
        run: mod git apply . --last-recipe-run

      - name: Create branch, commit, push, and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nothing changed? Exit cleanly without opening an empty PR.
          if git diff --quiet && git diff --cached --quiet; then
            echo "No Prethink context changes detected — skipping PR."
            exit 0
          fi

          BRANCH="prethink/update-context-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Update Prethink context"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "Update Prethink context" \
            --body "Automated weekly regeneration of Moderne Prethink context files (\`.moderne/context/\`).

          Generated by the \`Update Prethink context\` workflow."
